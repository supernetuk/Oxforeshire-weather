<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oxfordshire Weather – report &amp; satellite</title>
  <meta name="description" content="Today's Oxfordshire weather report for Oxford, Witney, Banbury and more, with live satellite and rain radar.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Oxfordshire Weather</h1>
    <p id="report-status" class="status" aria-live="polite"></p>
  </header>

  <main>
    <section id="report" aria-labelledby="report-h">
      <h2 id="report-h">Weather report</h2>
      <div id="day-tabs" role="tablist"></div>
      <div id="report-text"></div>
    </section>

    <section aria-labelledby="map-h">
      <h2 id="map-h">Satellite &amp; rain radar</h2>
      <div class="map-bar">
        <button id="play" type="button">▶ Play radar</button>
        <span id="radar-time"></span>
        <span id="radar-status" class="status"></span>
      </div>
      <div id="map" role="region" aria-label="Satellite weather map of Oxfordshire"></div>
      <p class="note">Satellite images refresh about every 15 minutes; rain radar shows the last 2 hours.</p>
    </section>

    <section aria-labelledby="towns-h">
      <h2 id="towns-h">Towns</h2>
      <div id="towns"></div>
    </section>
  </main>

  <footer>
    Forecast: <a href="https://open-meteo.com/">Open-Meteo</a> (CC BY 4.0) ·
    Satellite: <a href="https://view.eumetsat.int">EUMETSAT</a> ·
    Radar: <a href="https://www.rainviewer.com/">RainViewer</a> ·
    Map: © OpenStreetMap contributors · Supernet UK Limited
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
